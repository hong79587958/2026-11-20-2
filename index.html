<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행정정보 통합관리 및 공동활용 조항 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f4; --surface:#fff; --ink:#1a2333; --muted:#5a6578; --line:#d5dbe5;
  --accent:#1f4e8c; --mark:#ffe28a; --markink:#1a2333;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --surface:#1a2230; --ink:#e7ebf2; --muted:#9aa6ba; --line:#2d3748;
    --accent:#7fb0ee; --mark:#6b5a14; --markink:#fff4cc; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#1a2230; --ink:#e7ebf2; --muted:#9aa6ba; --line:#2d3748;
  --accent:#7fb0ee; --mark:#6b5a14; --markink:#fff4cc; color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 20px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1100px;margin:0 auto}
h1{font-family:"Noto Serif KR","Batang",serif;font-size:1.35rem;margin:0 0 12px;letter-spacing:-.01em}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{position:relative;flex:1 1 280px}
input[type=search]{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px}
input[type=search]:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#count{font-weight:500;color:var(--accent);white-space:nowrap;font-size:1.05rem}
#count span{color:var(--muted);font-weight:400;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:16px 18px}
.card h2{font-family:"Noto Serif KR","Batang",serif;font-size:1.05rem;margin:0 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h2 .no{color:var(--accent)}
.card p{margin:0;font-size:.95rem;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
mark{background:var(--mark);color:var(--markink);border-radius:2px;padding:0 1px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>행정정보 통합관리 및 공동활용에 관한 법</h1>
    <div class="bar">
      <div class="field">
        <input id="q" type="search" placeholder="본문에서 찾을 키워드를 입력하세요" aria-label="본문 키워드 검색" autocomplete="off">
      </div>
      <div id="count" role="status" aria-live="polite"></div>
    </div>
  </div>
</header>
<main><div id="grid" class="grid"></div></main>

<script>
const DATA = [
{"조":"제1조","제목":"목적","본문":"이 법은 행정정보의 통합관리와 공동활용에 관한 기본적인 사항을 정함으로써 행정의 효율성과 국민의 편익 증진에 이바지함을 목적으로 한다."},
{"조":"제2조","제목":"정의","본문":"이 법에서 사용하는 용어의 뜻은 다음 각 호와 같다.\n1. \"행정정보\"란 「전자정부법」 제2조제6호에 따른 행정정보를 말한다.\n2. \"공동활용\"이란 행정기관 간 행정정보를 상호 제공하여 사용하는 것을 말한다.\n3. \"통합관리\"란 「공공기록물 관리에 관한 법률」 제3조에 따른 기록물의 일부로 행정정보를 통합 관리하는 것을 말한다.\n4. \"데이터 표준\"이란 행정정보의 공동활용을 위한 형식·코드·식별자에 관한 표준을 말한다."},
{"조":"제3조","제목":"다른 법률과의 관계","본문":"행정정보의 통합관리 및 공동활용에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. 특히 「개인정보 보호법」, 「공공데이터의 제공 및 이용 활성화에 관한 법률」, 「지능정보화 기본법」에 따른 사항은 해당 법률을 우선 적용한다."},
{"조":"제4조","제목":"국가 등의 책무","본문":"국가와 지방자치단체는 행정정보의 통합관리와 공동활용을 위하여 필요한 시책을 수립하여야 한다. 행정안전부장관은 그 시책을 종합적으로 조정하며, 자세한 사항은 대통령령으로 정한다."},
{"조":"제5조","제목":"기본계획의 수립","본문":"① 행정안전부장관은 행정정보 통합관리 기본계획을 5년마다 수립하여야 한다.\n② 기본계획에는 다음 각 호의 사항을 포함하여야 한다.\n1. 행정정보 통합관리의 기본방향\n2. 행정정보 공동활용의 활성화 방안\n3. 「전자정부법」 제3조의 행정기관 정보화 시책과의 연계\n4. 그 밖에 대통령령으로 정하는 사항"},
{"조":"제6조","제목":"시행계획의 수립","본문":"행정기관의 장은 매년 시행계획을 수립하여야 하며, 그 결과를 행정안전부장관에게 보고하여야 한다. 시행계획의 형식과 절차는 대통령령으로 정한다."},
{"조":"제7조","제목":"공동활용 협의회","본문":"행정정보 공동활용에 관한 사항을 협의하기 위하여 행정안전부에 행정정보 공동활용 협의회를 둔다. 협의회의 구성과 운영에 필요한 사항은 대통령령으로 정한다."},
{"조":"제8조","제목":"공동활용 신청","본문":"행정기관의 장은 다른 행정기관이 보유한 행정정보를 활용하려는 경우에는 행정안전부장관에게 신청하여야 한다."},
{"조":"제9조","제목":"공동활용 승인","본문":"행정안전부장관은 신청을 받은 경우 「개인정보 보호법」 제17조에 따른 절차를 거쳐 30일 이내에 승인 여부를 결정하여야 한다."},
{"조":"제10조","제목":"보안 조치","본문":"공동활용 시 행정정보의 안전성 확보를 위하여 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 및 「개인정보 보호법」에서 정하는 보안 조치를 적용하여야 한다."},
{"조":"제11조","제목":"데이터 표준","본문":"행정안전부장관은 데이터 표준을 정하여 고시할 수 있다. 데이터 표준의 적용 범위와 시기는 대통령령으로 정한다."},
{"조":"제12조","제목":"표준 적용 의무","본문":"행정기관은 행정정보를 생산·관리·활용할 때 제11조에 따른 데이터 표준을 따라야 한다."},
{"조":"제13조","제목":"실태조사","본문":"행정안전부장관은 매년 행정정보 통합관리 실태를 조사하여 그 결과를 공개한다."},
{"조":"제14조","제목":"과태료","본문":"다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다.\n1. 제8조를 위반하여 승인 없이 공동활용한 자\n2. 제12조에 따른 데이터 표준을 정당한 사유 없이 위반한 자"},
{"조":"제15조","제목":"시행일","본문":"이 법은 2026년 7월 1일부터 시행한다."}
];

const grid = document.getElementById('grid');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function highlight(text, kw){
  const safe = esc(text);
  if(!kw) return safe;
  const re = new RegExp(reEsc(esc(kw)), 'gi');
  return safe.replace(re, m => '<mark>' + m + '</mark>');
}

function render(){
  const kw = qEl.value.trim();
  const list = kw ? DATA.filter(d => d['본문'].toLowerCase().includes(kw.toLowerCase())) : DATA;
  countEl.innerHTML = '결과 ' + list.length + '건 <span>/ 전체 ' + DATA.length + '조</span>';
  if(!list.length){
    grid.innerHTML = '<div class="empty">본문에 “' + esc(kw) + '”이(가) 들어 있는 조항이 없습니다. 다른 키워드로 검색해 보세요.</div>';
    return;
  }
  grid.innerHTML = list.map(d =>
    '<article class="card"><h2><span class="no">' + esc(d['조']) + '</span><span>' + esc(d['제목']) + '</span></h2>' +
    '<p>' + highlight(d['본문'], kw) + '</p></article>'
  ).join('');
}

qEl.addEventListener('input', render);
render();
</script>
</body>
</html>
